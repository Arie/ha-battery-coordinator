name: Battery Coordinator
version: "1.7.0"
slug: battery-coordinator
description: Coordinates a Zendure 2400 AC battery with HomeWizard Plug-in Batteries against a HomeWizard P1 meter — prevents oscillation, cross-charging, and grid bleed.
url: "https://github.com/Arie/ha-battery-coordinator"
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_role: default
apparmor: true

options:
  # ─── Required: device addresses ───
  zendure_ip: ""
  hw_p1_ip: ""
  hw_p1_token: ""

  # ─── Optional: solar sensor via Home Assistant ───
  # Leave empty to skip. Without solar, the brain still works — it just
  # can't auto-flip discharge→charge at sunrise.
  solar_entity: ""

  # ─── Dynamic-tariff gates (optional, via Home Assistant) ───
  # Point each at any on/off entity (input_boolean, binary_sensor, template).
  # The brain has no price model — HA automations decide, these carry the
  # answer. Empty = feature off, identical to previous behaviour.
  #   inhibit_discharge_entity: on → hold SOC (e.g. price is cheap, or the
  #     EV is charging and you don't want the house battery paying for it)
  #   inhibit_charge_entity:    on → stop charging (e.g. export is worth more)
  #   force_charge_entity:      on → charge from the grid deliberately.
  #     Requires allow_grid_charge below; ignored otherwise.
  inhibit_discharge_entity: ""
  inhibit_charge_entity: ""
  force_charge_entity: ""
  #   force_discharge_entity:   on → discharge at max, exporting the surplus.
  #     Requires allow_grid_export below; ignored otherwise.
  force_discharge_entity: ""
  #   setpoint_entity: a numeric entity (W) written by an external
  #     optimiser such as Day Ahead Optimizer. +W = charge, -W = discharge,
  #     0 = hold. The Zendure follows it; the plug-in batteries are
  #     permissioned so they cannot fight it. Unavailable/non-numeric =
  #     no setpoint, normal behaviour. Requires BOTH allow_grid_charge and
  #     allow_grid_export.
  setpoint_entity: ""

  # ─── Solar curtailment (optional) ───
  # Throttles the inverter by writing ONLY its active power limit (0xF001)
  # through solar_limit_entity. Fails open: unreachable/unavailable gates
  # mean no curtailment, and the limit is restored to 100%.
  #   curtail_export_entity: on → exporting earns nothing/costs money, so
  #     curtail solar to hold the grid at curtail_target_w.
  #   import_pays_entity:    on → importing is paid, so solar to 0% and
  #     the plug-in batteries charge to full from the grid.
  curtail_export_entity: ""
  import_pays_entity: ""
  solar_limit_entity: ""
  solar_rated_w: 6000
  curtail_target_w: -30
  curtail_deadband_w: 30
  curtail_step_pct: 1
  curtail_min_write_s: 3
  curtail_settle_down_s: 20
  curtail_settle_up_s: 5

  # Opt out of the "never charge from the grid" hard rule. Off by default.
  # Only meaningful on a dynamic tariff where a cheap hour is worth banking
  # against an expensive one. Needs force_charge_entity set.
  allow_grid_charge: false

  # Opt out of the "never discharge into export" hard rule. Off by default.
  # Separate from allow_grid_charge — that one gates import, this one gates
  # export. Needs force_discharge_entity set.
  allow_grid_export: false

  # ─── PIB SOC + power via HA (defaults match the HomeWizard integration) ───
  # The HW P1 /api/batteries endpoint only gives combined power and no SOC,
  # so the per-PIB values must come from HA. Up to 4 batteries supported.
  pib_soc_entities:
    - sensor.plug_in_battery_state_of_charge
    - sensor.plug_in_battery_state_of_charge_2
  pib_power_entities:
    - sensor.plug_in_battery_power
    - sensor.plug_in_battery_power_2

  # ─── Hardware limits ───
  zen_max_charge_w: 2400
  zen_max_discharge_w: 2400
  zen_soc_min: 10
  zen_soc_max: 100

  # ─── Brain tuning (advanced — defaults are production-tested) ───
  brain_step_holdoff_s: 15
  brain_flip_s: 30
  brain_wake_charge_s: 10
  brain_wake_discharge_s: 30
  brain_help_enter_s: 15
  brain_help_exit_s: 15
  brain_pib_high_w: 1200
  brain_pib_maxed_w: 1400
  brain_pib_low_w: 200
  brain_pib_taper_cap_w: 300
  brain_nom_deadband_w: 10
  brain_p1_export_w: -100
  brain_p1_import_w: 200

  # ─── Operations ───
  log_level: info
  dry_run: false

schema:
  zendure_ip: str
  hw_p1_ip: str
  hw_p1_token: password

  solar_entity: "str?"
  inhibit_discharge_entity: "str?"
  inhibit_charge_entity: "str?"
  force_charge_entity: "str?"
  force_discharge_entity: "str?"
  setpoint_entity: "str?"
  curtail_export_entity: "str?"
  import_pays_entity: "str?"
  solar_limit_entity: "str?"
  solar_rated_w: "int(500,30000)"
  curtail_target_w: "int(-500,500)"
  curtail_deadband_w: "int(0,500)"
  curtail_step_pct: "int(1,100)"
  curtail_min_write_s: "int(1,300)"
  curtail_settle_down_s: "int(0,600)"
  curtail_settle_up_s: "int(0,600)"
  allow_grid_charge: bool
  allow_grid_export: bool

  pib_soc_entities:
    - "match(^.+\\..+$)"
  pib_power_entities:
    - "match(^.+\\..+$)"

  zen_max_charge_w: "int(100,4800)"
  zen_max_discharge_w: "int(100,4800)"
  zen_soc_min: "int(0,50)"
  zen_soc_max: "int(50,100)"

  brain_step_holdoff_s: "int(1,120)"
  brain_flip_s: "int(5,300)"
  brain_wake_charge_s: "int(1,120)"
  brain_wake_discharge_s: "int(1,300)"
  brain_help_enter_s: "int(1,120)"
  brain_help_exit_s: "int(1,120)"
  brain_pib_high_w: "int(100,2000)"
  brain_pib_maxed_w: "int(500,2400)"
  brain_pib_low_w: "int(0,500)"
  brain_pib_taper_cap_w: "int(100,1000)"
  brain_nom_deadband_w: "int(1,100)"
  brain_p1_export_w: "int(-1000,0)"
  brain_p1_import_w: "int(0,1000)"

  log_level: "list(debug|info|warning|error)"
  dry_run: bool
